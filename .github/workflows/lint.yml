name: CI

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [22.x, 26.x]
                # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

        steps:
            - uses: actions/checkout@v5
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "npm"
            - run: npm ci
            - run: npm run build --if-present
            - run: npm run lint
            - run: npm run test

    coverage:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5
            - name: Use Node.js 22.x
              uses: actions/setup-node@v5
              with:
                  node-version: 22.x
                  cache: "npm"
            - run: npm ci
            # `shell: bash` sets -o pipefail; without it the pipe to tee would mask a
            # non-zero exit from vitest and this job would go green on a crashed run.
            - name: Run tests with coverage
              shell: bash
              run: npm run test:coverage | tee coverage-output.txt
            - name: Publish coverage summary
              if: always()
              run: |
                  { echo "### Coverage (src/)"; echo '```'; cat coverage-output.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: coverage/

